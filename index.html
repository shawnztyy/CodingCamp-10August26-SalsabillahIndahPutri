<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Life Dashboard ✨</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
  
  <div class="container">
    <!-- Header: Greeting, Clock & Theme Toggle -->
    <header class="card header-card">
      <div class="header-top">
        <button id="theme-toggle" class="btn-theme">☀️ Light Mode</button>
      </div>
      <h1 id="clock">00:00:00</h1>
      <p id="date-display">Senin, 10 Agustus 2026</p>
      <h2 id="greeting">Selamat Datang! ✨</h2>
      <div class="name-input-group">
        <input type="text" id="user-name-input" placeholder="Tulis namamu di sini..">
        <button id="save-name-btn" class="btn-pink">Simpan</button>
      </div>
      
    </header>

    <!-- Top Grid: Focus Timer & To-Do List -->
    <div class="dashboard-grid">
      
      <!-- Section 1: Focus Timer -->
      <section class="card timer-card">
        <h3>⏱️ Focus Timer </h3>
        <div id="timer-display">25:00</div>
        
        <!-- Opsi Mengubah Waktu Pomodoro -->
        <div class="custom-timer-group">
          <input type="number" id="custom-minutes" min="1" max="180" placeholder="Menit" value="25">
          <button id="set-timer-btn" class="btn-purple">Set Waktu ⏳</button>
        </div>

        <div class="timer-controls">
          <button id="start-timer" class="btn-pink">Start ▶️</button>
          <button id="stop-timer" class="btn-orange">Stop ⏸️</button>
          <button id="reset-timer" class="btn-blue">Reset 🔄</button>
        </div>
      </section>

      <!-- Section 2: To-Do List  -->
      <section class="card todo-card">
        <h3>📝 My Tasks </h3>
        <form id="todo-form">
          <input type="text" id="todo-input" placeholder="Ada rencana apa hari ini? ✨" required>
          <button type="submit" class="btn-pink">Tambah ➕</button>
        </form>
        <p id="todo-error" class="error-msg"></p>
        <ul id="todo-list"></ul>
      </section>

    </div>

    <!-- Section 3: Quick Links  -->
    <section class="card links-card">
      <h3>🔗 Quick Links </h3>
      <form id="link-form">
        <input type="text" id="link-title" placeholder="Judul Link" required>
        <input type="url" id="link-url" placeholder="URL (https://...) 🌐" required>
        <button type="submit" class="btn-purple">Tambah Link ➕</button>
      </form>
      <div id="links-container" class="links-grid"></div>
    </section>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
